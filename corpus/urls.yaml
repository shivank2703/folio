# Where ingest.add looks for each company's annual reports.
#
# Each company, keyed by the code Folio uses for it, gives either or both of:
#   investor_page: a page linking the company's annual-report PDFs. ingest.add
#                  reads every PDF link on it and takes the latest fiscal year.
#   reports:       report URLs kept by hand, for sites that block scripts or
#                  archives that cannot be searched (NSE's file archive).
#                  fiscal_year is optional; the report's own pages say it.
# Explicit reports win over the investor page when both offer the same year.

HCC:
  name: Hindustan Construction Company
  listing: BSE 500185 · NSE HCC
  reports:
    - url: https://hccindia.com/uploads/reports/0_14711100_1755498593_HCC_Annual_Report_2025.pdf
      fiscal_year: FY25

