  listing: CIN L24124RJ1985PLC003293
  reports:
    - url: https://www.chambalfertilisers.com/pdf/Annual-Report-for-the-Financial-Year-2024-2025.pdf
      fiscal_year: FY25

NAVNEET:
  name: Navneet Education
  listing: BSE 508989 · NSE NAVNETEDUL
  reports:
    - url: https://navneet.com/annual-report-24-25.pdf
      fiscal_year: FY25

